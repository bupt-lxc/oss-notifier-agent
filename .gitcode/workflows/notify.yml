name: OSS Notifier Agent

on:
  schedule:
    - cron: "9 14 * * *"
  workflow_dispatch:
    inputs:
      fetch_only:
        description: Fetch repository activity without calling the model or sending email
        type: boolean
        default: true
      dry_run:
        description: Generate a preview without sending email when fetch_only is off
        type: boolean
        default: false
      gitcode_repo:
        description: Optional GitCode owner/repo to query during a fetch-only run
        type: string
        default: ""

permissions:
  repository: read

concurrency:
  enable: true
  max: 1
  exceed-action: QUEUE

jobs:
  notify:
    runs-on: [ubuntu-latest, x64, small]
    env:
      SCHEDULE_GROUP: daily
      LOOKBACK_HOURS: "25"
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      AGENT_SCHEDULED_EMAIL: ${{ vars.AGENT_SCHEDULED_EMAIL }}
    steps:
      - name: Check out the notifier
        uses: checkout

      - name: Set up Python
        uses: setup-python
        with:
          # The AtomGit setup catalog includes 3.14 but has no 3.13 build.
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      # AtomGit only makes the inputs context available during manual runs.
      - name: Read manual inputs
        if: ${{ atomgit.event_name == 'Manual' || atomgit.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          FETCH_ONLY_INPUT: ${{ inputs.fetch_only }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          GITCODE_REPO_INPUT: ${{ inputs.gitcode_repo }}
        run: |
          mode=fetch
          target=
          if [[ "${FETCH_ONLY_INPUT,,}" != "false" ]]; then
            if [[ -n "$GITCODE_REPO_INPUT" ]]; then
              if [[ ! "$GITCODE_REPO_INPUT" =~ ^[a-zA-Z0-9_-][a-zA-Z0-9_.-]*/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*$ ]]; then
                echo 'gitcode_repo must be a GitCode owner/repo path' >&2
                exit 1
              fi
              target="$GITCODE_REPO_INPUT"
            fi
          elif [[ "${DRY_RUN_INPUT,,}" == "true" ]]; then
            mode=preview
          else
            mode=email
          fi
          printf 'Manual run mode: %s\n' "$mode"
          printf '%s\n%s\n' "$mode" "$target" > .gitcode/.notify-inputs

      - name: Run digest
        shell: bash
        run: bash .gitcode/run-notify.sh
        env:
          EVENT_NAME: ${{ atomgit.event_name }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_URL: ${{ secrets.DASHSCOPE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITCODE_PIPELINE_CONFIG: ${{ secrets.GITCODE_PIPELINE_CONFIG }}
          AGENT_PIPELINE_CONFIG: ${{ secrets.AGENT_PIPELINE_CONFIG }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          AGENT_EMAIL_FROM: ${{ secrets.AGENT_EMAIL_FROM }}
          AGENT_EMAIL_TO: ${{ secrets.AGENT_EMAIL_TO }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
