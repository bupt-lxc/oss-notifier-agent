name: OSS Notifier Agent (Scan)

on:
  workflow_call:
    inputs:
      schedule_group:
        type: string
        default: ""
      lookback_hours:
        type: number
        default: 25
      fetch_only:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      gitcode_repo:
        type: string
        default: ""

permissions:
  repository: read

jobs:
  scan:
    runs-on: [ubuntu-latest, x64, small]
    env:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
    steps:
      - name: Check out the notifier
        uses: checkout

      - name: Set up Python
        uses: setup-python
        with:
          # The AtomGit setup catalog includes 3.14 but has no 3.13 build.
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run digest
        shell: bash
        env:
          SCHEDULE_GROUP: ${{ inputs.schedule_group }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          FETCH_ONLY_INPUT: ${{ inputs.fetch_only }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          GITCODE_REPO_INPUT: ${{ inputs.gitcode_repo }}
          AGENT_SCHEDULED_EMAIL: ${{ vars.AGENT_SCHEDULED_EMAIL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_URL: ${{ secrets.DASHSCOPE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITCODE_PIPELINE_CONFIG: ${{ secrets.GITCODE_PIPELINE_CONFIG }}
          AGENT_PIPELINE_CONFIG: ${{ secrets.AGENT_PIPELINE_CONFIG }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          AGENT_EMAIL_FROM: ${{ secrets.AGENT_EMAIL_FROM }}
          AGENT_EMAIL_TO: ${{ secrets.AGENT_EMAIL_TO }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          [[ -n "${ANTHROPIC_BASE_URL:-}" ]] || unset ANTHROPIC_BASE_URL
          [[ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]] || unset ANTHROPIC_AUTH_TOKEN
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -n "${ANTHROPIC_AUTH_TOKEN:-}" ]]; then
            export ANTHROPIC_API_KEY="$ANTHROPIC_AUTH_TOKEN"
          fi

          args=(--platform gitcode)
          target=
          if [[ -n "$SCHEDULE_GROUP" ]]; then
            args+=(--group "$SCHEDULE_GROUP")
            export AGENT_SEARCH_WINDOW_HOURS="$LOOKBACK_HOURS"
            if [[ "${AGENT_SCHEDULED_EMAIL,,}" != "true" ]]; then
              args+=(--fetch-only)
            fi
          elif [[ "${FETCH_ONLY_INPUT,,}" != "false" ]]; then
            args+=(--fetch-only)
            target="$GITCODE_REPO_INPUT"
            if [[ -n "$target" && ! "$target" =~ ^[a-zA-Z0-9_-][a-zA-Z0-9_.-]*/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*$ ]]; then
              echo 'gitcode_repo must be a GitCode owner/repo path' >&2
              exit 1
            fi
          elif [[ "${DRY_RUN_INPUT,,}" == "true" ]]; then
            args+=(--dry-run)
          fi

          AGENT_PIPELINE_CONFIG="${GITCODE_PIPELINE_CONFIG:-${AGENT_PIPELINE_CONFIG:-}}"
          if [[ -n "$target" ]]; then
            printf 'Scanning GitCode repository %s\n' "$target"
            printf -v AGENT_PIPELINE_CONFIG 'repositories:\n  - repo: %s\n    platform: gitcode\n' "$target"
          elif [[ -z "$AGENT_PIPELINE_CONFIG" ]]; then
            AGENT_PIPELINE_CONFIG=$'repositories:\n  - repo: Ascend/MindIE-Motor\n    platform: gitcode\n    schedule_group: fast\n'
          fi
          export AGENT_PIPELINE_CONFIG
          python -m uv run --python 3.14 --locked --no-dev python -m agent.pipeline.run "${args[@]}"
