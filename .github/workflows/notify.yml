name: OSS Notifier Agent

on:
  schedule:
    # Daily at 14:09 UTC = ~7am Pacific Daylight Time (UTC-7). GitHub Actions
    # cron is UTC-only with no DST support, so during Pacific Standard Time
    # (UTC-8, roughly Nov-Mar) this actually runs at ~6am Pacific instead of
    # 7am — a one-hour drift twice a year, not something cron can fix.
    # Minute is :09, not :00 — GitHub's own docs call out the top of the
    # hour as a high-load period more prone to scheduling delay; we saw a
    # ~1h45m delay on the very first scheduled run with "0 14 * * *".
    - cron: "9 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the digest without sending an email
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oss-notifier-agent
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run digest
        run: |
          [[ -n "$ANTHROPIC_BASE_URL" ]] || unset ANTHROPIC_BASE_URL
          [[ -n "$ANTHROPIC_AUTH_TOKEN" ]] || unset ANTHROPIC_AUTH_TOKEN
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --locked python -m agent.pipeline.run "${args[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Only the secret matching AGENT_MODEL's provider needs a real
          # value; the others can be left unset in this fork's secrets.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_URL: ${{ secrets.DASHSCOPE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_PIPELINE_CONFIG: ${{ secrets.AGENT_PIPELINE_CONFIG }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          AGENT_EMAIL_FROM: ${{ secrets.AGENT_EMAIL_FROM }}
          AGENT_EMAIL_TO: ${{ secrets.AGENT_EMAIL_TO }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
