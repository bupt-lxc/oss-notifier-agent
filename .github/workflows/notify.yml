name: OSS Notifier Agent

on:
  schedule:
    # Cron expressions are in UTC. Keep them in sync with MONITOR_SCHEDULES.
    - cron: "7,37 * * * *"
    - cron: "11 * * * *"
    - cron: "13 */3 * * *"
    - cron: "17 */12 * * *"
    - cron: "9 14 * * *"
    - cron: "19 14 * * 1"
  workflow_dispatch:
    inputs:
      group:
        description: Schedule group to scan (leave blank to scan all repositories)
        type: string
        required: false
      dry_run:
        description: Preview the digest without sending an email
        type: boolean
        default: false

env:
  # To add a group, add its cron here and under on.schedule, then set
  # schedule_group on the relevant repositories in AGENT_PIPELINE_CONFIG.
  MONITOR_SCHEDULES: >-
    {
      "veryfast": {"cron": "7,37 * * * *", "lookback_hours": 2},
      "fast": {"cron": "11 * * * *", "lookback_hours": 3},
      "normal": {"cron": "13 */3 * * *", "lookback_hours": 5},
      "slow": {"cron": "17 */12 * * *", "lookback_hours": 14},
      "daily": {"cron": "9 14 * * *", "lookback_hours": 25},
      "weekly": {"cron": "19 14 * * 1", "lookback_hours": 170}
    }

permissions:
  contents: read

concurrency:
  # All groups share state. Serialize pipeline runs, including manual sends.
  group: oss-notifier-agent
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Update the deduplication ledger on notifier-state.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run digest
        shell: bash
        run: |
          [[ -n "$ANTHROPIC_BASE_URL" ]] || unset ANTHROPIC_BASE_URL
          [[ -n "$ANTHROPIC_AUTH_TOKEN" ]] || unset ANTHROPIC_AUTH_TOKEN

          groups=$(jq -er 'keys | join(",")' <<< "$MONITOR_SCHEDULES")
          args=(--github-state --known-groups "$groups")
          if [[ "$TRIGGER_EVENT" == "schedule" || -n "$MONITOR_GROUP" ]]; then
            if ! route=$(jq -er --arg event "$TRIGGER_EVENT" --arg cron "$TRIGGER_CRON" \
              --arg group "$MONITOR_GROUP" '
                first(to_entries[] | select(
                  if $event == "schedule" then .value.cron == $cron else .key == $group end
                )) | [.key, .value.lookback_hours] | @tsv
              ' <<< "$MONITOR_SCHEDULES"); then
              echo "Unknown schedule or monitoring group." >&2
              exit 1
            fi
            IFS=$'\t' read -r group AGENT_SEARCH_WINDOW_HOURS <<< "$route"
            export AGENT_SEARCH_WINDOW_HOURS
            args+=(--group "$group")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --locked python -m agent.pipeline.run "${args[@]}"
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          MONITOR_GROUP: ${{ inputs.group }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Only the secret matching AGENT_MODEL's provider needs a real
          # value; the others can be left unset in this fork's secrets.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_URL: ${{ secrets.DASHSCOPE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_PIPELINE_CONFIG: ${{ secrets.AGENT_PIPELINE_CONFIG }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          AGENT_EMAIL_FROM: ${{ secrets.AGENT_EMAIL_FROM }}
          AGENT_EMAIL_TO: ${{ secrets.AGENT_EMAIL_TO }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
